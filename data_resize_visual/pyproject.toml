[project]
name = "data-resize-visual"
version = "0.1.0"
description = "Apply OpenPI's exact SigLIP resize stage to every frame of an MP4 video"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.22.4,<2.0.0",
    "pillow==11.2.1",
]

[project.scripts]
data-resize-visual = "data_resize_visual.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
